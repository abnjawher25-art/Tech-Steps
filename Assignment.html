<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="Img/icon.png">
  <title>Ebrahim | Assignment</title>
  <link rel="stylesheet" href="Css/Assignment/Style.css">
</head>
<body>
  <div class="Container">
    <form>
      <div class="Name-Form">
        <label>الاسم الكامل: </label>
        <input type="text" placeholder="أدخل اسمك" class="Name" required>
      </div>
      <div class="Email-Form">
        <label for="email">البريد الالكتروني: </label>
        <input type="email" placeholder="example@domain.com" class="Email" required>
      </div>
      <div class="Country-Form">
        <label>الدولة: </label>
        <select class="option">
          <option>اليمن</option>
          <option selected>اختر الدولة </option>
          <option>السعودية</option>
          <option>الكويت</option>
          <option>العراق</option>
          <option>البرتغال</option>
          <option>الهند</option>
          <option>سوريا</option>
          <option>الجزائر</option>
          <option>مالي</option>
          <option>صريبا</option>
        </select>
      </div>
      <div class="Hope-Form">
        <label>الهوايات: </label>
        <div class="checkbox-form">
          <div>
            <input type="checkbox">
            <label>القراءة</label>
          </div>
          <div>
            <input type="checkbox">
            <label>البرمجة</label>
          </div>
          <div>
            <input type="checkbox">
            <label>الرياضة</label>
          </div>
        </div>
      </div>
      <div class="Long-Text">
        <label>ملاحظات: </label>
        <textarea placeholder="اكتب ملاحظتك هنا ..."></textarea>
      </div>
      <dir class="Buttons-form">
        <button type="submit" class="submit-button">ارسال</button>
        <button type="reset" class="reset-botton">إعادة التعيين</button>
      </dir>
    </form>
  </div>  
</body>

</html>
